server:
  port: ${PORT}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ${SPRING_APPLICATION_NAME}
  mongodb:
    uri: ${SPRING_MONGODB_URI}
    database: ${SPRING_MONGODB_DATABASE}
  data:
    mongodb:
      auto-index-creation: ${SPRING_MONGODB_AUTO_INDEX_CREATION}
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-date-timestamps-as-nanoseconds: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT}
            read-timeout: ${FEIGN_READ_TIMEOUT}
            logger-level: ${FEIGN_LOG_LEVEL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mongo
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      sla:
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1s, 2s
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY}
    propagation:
      type: ${MANAGEMENT_TRACING_PROPAGATION_TYPE}
    baggage:
      correlation:
        enabled: true
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED}
  logging:
    export:
      otlp:
        enabled: ${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED}
  opentelemetry:
    enabled: ${MANAGEMENT_OPENTELEMETRY_ENABLED}
    map-environment-variables: true
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: ${APP_VERSION}
      deployment.environment: ${ENVIRONMENT}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT_TRACES}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT_LOGS}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT_METRICS}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]){yellow} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: ${LOG_LEVEL_ROOT}
    com.example.templatejava: ${LOG_LEVEL_APP}

app:
  feign:
    bureau:
      url: ${BUREAU_SERVICE_URL}

resilience4j:
  circuitbreaker:
    instances:
      bureau:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
  retry:
    instances:
      bureau:
        maxAttempts: 3
        waitDuration: 500

---

spring:
  config:
    activate:
      on-profile: cloud

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT}

