services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${SPRING_MONGODB_DATABASE:-example_db}
      TZ: ${TZ:-UTC}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - template-java-network

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock
    restart: unless-stopped
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "${WIREMOCK_PORT:-8081}:8080"
    volumes:
      - ./wiremock:/home/wiremock
      - ./wiremock/extensions:/var/wiremock/extensions
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - template-java-network

  migrate-mongo:
    build:
      context: ./migrate-mongo
      dockerfile: Dockerfile.migrate-mongo
    image: ms-migrate-mongo:latest
    container_name: migrate-mongo
    restart: "no"
    volumes:
      - ./migrate-mongo/migrations:/app/migrations
      - ./migrate-mongo/migrate-mongo-config.js:/app/migrate-mongo-config.js
    environment:
      - SPRING_MONGODB_URI=${SPRING_DOCKER_MONGODB_URI:-mongodb://mongodb:27017/example_db}
      - SPRING_MONGODB_DATABASE=${SPRING_MONGODB_DATABASE:-example_db}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - template-java-network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - template-java-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - template-java-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - template-java-network

  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    restart: unless-stopped
    command: ["-config.file=/etc/mimir.yaml", "-target=all"]
    volumes:
      - ./infra/mimir-config.yaml:/etc/mimir.yaml:ro
    ports:
      - "9009:9009"
    networks:
      - template-java-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - template-java-network

  api:
    image: ms-template-java:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-template-java-api
    restart: unless-stopped
    command: ["-jar", "/app/app.jar", "--spring.profiles.active=api,cloud"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - TZ=${TZ:-UTC}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--Duser.timezone=UTC}
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME:-ms-example}
      - SPRING_MONGODB_URI=${SPRING_DOCKER_MONGODB_URI:-mongodb://mongodb:27017/example_db}
      - SPRING_MONGODB_DATABASE=${SPRING_MONGODB_DATABASE:-example_db}
      - SPRING_MONGODB_AUTO_INDEX_CREATION=${SPRING_MONGODB_AUTO_INDEX_CREATION:-false}
      - BUREAU_SERVICE_URL=${BUREAU_SERVICE_URL:-http://wiremock:8080}
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP:-DEBUG}
      - LOG_STRUCTURED_FORMAT=${LOG_STRUCTURED_FORMAT:-ecs}
      - FEIGN_CONNECT_TIMEOUT=${FEIGN_CONNECT_TIMEOUT:-5000}
      - FEIGN_READ_TIMEOUT=${FEIGN_READ_TIMEOUT:-10000}
      - FEIGN_LOG_LEVEL=${FEIGN_LOG_LEVEL:-BASIC}
      - MANAGEMENT_OPENTELEMETRY_ENABLED=${MANAGEMENT_OPENTELEMETRY_ENABLED:-true}
      - MANAGEMENT_TRACING_ENABLED=${MANAGEMENT_TRACING_ENABLED:-true}
      - MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:-true}
      - MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED=${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:-true}
      - MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:-true}
      - MANAGEMENT_OTLP_METRICS_EXPORT_STEP=${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:-10s}
      - OTEL_EXPORTER_OTLP_ENDPOINT_TRACES=${OTEL_DOCKER_ENDPOINT_TRACES:-http://otel-collector:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_ENDPOINT_LOGS=${OTEL_DOCKER_ENDPOINT_LOGS:-http://otel-collector:4318/v1/logs}
      - OTEL_EXPORTER_OTLP_ENDPOINT_METRICS=${OTEL_DOCKER_ENDPOINT_METRICS:-http://otel-collector:4318/v1/metrics}
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      - MANAGEMENT_TRACING_PROPAGATION_TYPE=${MANAGEMENT_TRACING_PROPAGATION_TYPE:-w3c,b3}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - ENVIRONMENT=${ENVIRONMENT:-cloud}
    depends_on:
      mongodb:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - template-java-network

  scheduling:
    image: ms-template-java:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-template-java-scheduling
    restart: unless-stopped
    command:
      - "-cp"
      - "/app/app.jar"
      - "-Dloader.main=com.example.templatejava.SchedulingApplication"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
      - "--spring.profiles.active=scheduling,customer-sync-job,order-expiration-job,cloud"
    environment:
      - TZ=${TZ:-UTC}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--Duser.timezone=UTC}
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME:-ms-example}
      - SPRING_MONGODB_URI=${SPRING_DOCKER_MONGODB_URI:-mongodb://mongodb:27017/example_db}
      - SPRING_MONGODB_DATABASE=${SPRING_MONGODB_DATABASE:-example_db}
      - BUREAU_SERVICE_URL=${BUREAU_SERVICE_URL:-http://wiremock:8080}
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP:-DEBUG}
      - LOG_STRUCTURED_FORMAT=${LOG_STRUCTURED_FORMAT:-ecs}
      - SHEDLOCK_LOCK_AT_MOST_FOR=${SHEDLOCK_LOCK_AT_MOST_FOR:-10m}
      - APP_CUSTOMER_SYNC_JOB_CADENCE=${APP_CUSTOMER_SYNC_JOB_CADENCE:-60000}
      - APP_CUSTOMER_SYNC_JOB_LOCK_AT_LEAST_FOR=${APP_CUSTOMER_SYNC_JOB_LOCK_AT_LEAST_FOR:-10s}
      - APP_CUSTOMER_SYNC_JOB_LOCK_AT_MOST_FOR=${APP_CUSTOMER_SYNC_JOB_LOCK_AT_MOST_FOR:-5m}
      - APP_ORDER_EXPIRATION_JOB_CADENCE=${APP_ORDER_EXPIRATION_JOB_CADENCE:-120000}
      - APP_ORDER_EXPIRATION_JOB_LOCK_AT_LEAST_FOR=${APP_ORDER_EXPIRATION_JOB_LOCK_AT_LEAST_FOR:-10s}
      - MANAGEMENT_OPENTELEMETRY_ENABLED=${MANAGEMENT_OPENTELEMETRY_ENABLED:-true}
      - MANAGEMENT_TRACING_ENABLED=${MANAGEMENT_TRACING_ENABLED:-true}
      - MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:-true}
      - MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED=${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:-true}
      - MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:-true}
      - MANAGEMENT_OTLP_METRICS_EXPORT_STEP=${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:-10s}
      - OTEL_EXPORTER_OTLP_ENDPOINT_TRACES=${OTEL_DOCKER_ENDPOINT_TRACES:-http://otel-collector:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_ENDPOINT_LOGS=${OTEL_DOCKER_ENDPOINT_LOGS:-http://otel-collector:4318/v1/logs}
      - OTEL_EXPORTER_OTLP_ENDPOINT_METRICS=${OTEL_DOCKER_ENDPOINT_METRICS:-http://otel-collector:4318/v1/metrics}
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      - MANAGEMENT_TRACING_PROPAGATION_TYPE=${MANAGEMENT_TRACING_PROPAGATION_TYPE:-w3c,b3}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - ENVIRONMENT=${ENVIRONMENT:-cloud}
    depends_on:
      mongodb:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    networks:
      - template-java-network

networks:
  template-java-network:
    name: template-java-network
    driver: bridge
